name: Android build

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Restore release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eiyo-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/eiyo-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test and build APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
      - name: Rename installer
        run: |
          installer_name="eiyoapp-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$installer_name"
          echo "INSTALLER_NAME=$installer_name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: eiyoapp-installer
          path: ${{ env.INSTALLER_NAME }}
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "eiyoapp-${{ github.ref_name }}.apk" --generate-notes --title "私の健康記録 ${{ github.ref_name }}"
